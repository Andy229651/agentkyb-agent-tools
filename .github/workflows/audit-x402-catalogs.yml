name: Read-only x402 Bazaar catalog audit
on:
  push:
    paths:
      - "scripts/audit-x402-catalogs.mjs"
      - ".github/workflows/audit-x402-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit anonymous facilitator catalogs (no keys or transfers)
        run: node scripts/audit-x402-catalogs.mjs
